<!doctype html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script>
    (function() {
      try {
        var stored = localStorage.getItem('theme');
        if (stored === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        } else {
          document.documentElement.classList.remove('light');
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <link rel="stylesheet" href="./src/index.css">
  <title>Green Daze Tracking Hub</title>
  <meta name="description" content="Green Daze Tracking Hub - Versione ZERO. Professional rehearsal and concert tracker for the band Green Daze.">
  <meta property="og:title" content="Green Daze Tracking Hub">
  <meta property="og:description" content="Green Daze Tracking Hub - Versione ZERO. Professional rehearsal and concert tracker for the band Green Daze.">
  <style>
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
  <script>
    window.addEventListener('error', function(event) {
      console.error('Global script error:', event);
      var root = document.getElementById('root');
      if (root && (!root.children.length || root.innerHTML.indexOf('Caricamento in corso') !== -1)) {
        root.innerHTML = '<div style="min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #121620; color: #ffffff; font-family: sans-serif; text-align: center; padding: 24px;">' +
          '<div style="font-size: 36px; margin-bottom: 12px;">⚠️</div>' +
          '<h2 style="font-size: 20px; font-weight: 800; margin-bottom: 8px; color: #ef4444; text-transform: uppercase; letter-spacing: 1px;">Errore di caricamento</h2>' +
          '<p style="color: #94a3b8; font-size: 13px; max-width: 420px; margin-bottom: 16px; word-break: break-word; font-family: monospace;">' + (event.message || 'Errore imprevisto durante il caricamento dello script.') + '</p>' +
          '<button onclick="try{localStorage.clear();}catch(e){}window.location.reload();" style="padding: 10px 22px; background: #00e660; color: #000; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;">Pulisci Cache e Ricarica</button>' +
        '</div>';
      }
    });
  </script>
</head>
<body class="bg-[#121620] overflow-x-hidden">
  <div id="root">
    <div style="min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #121620; color: #00e660; font-family: sans-serif; text-align: center; padding: 20px;">
      <div style="width: 44px; height: 44px; border: 4px solid #1e2433; border-top: 4px solid #00e660; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px;"></div>
      <div style="font-weight: 900; letter-spacing: 2px; font-size: 18px; text-transform: uppercase; color: #00e660;">GREEN DAZE</div>
      <div style="color: #94a3b8; font-size: 12px; margin-top: 6px; font-family: monospace;">Caricamento in corso...</div>
    </div>
  </div>
  <script type="module" src="./src/index.tsx"></script>
</body>
</html>
